name: IPTV EPG
on:
  workflow_dispatch:
  # Enable only after validating the production handover and GitHub Actions usage terms.
  # schedule:
  #   - cron: '23 4,10,16,22 * * *'
permissions:
  contents: read
concurrency:
  group: iptv-maintenance
  cancel-in-progress: false
jobs:
  epg:
    if: github.ref == 'refs/heads/main' && vars.IPTV_JOBS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/iptv
        with:
          ssh-key: ${{ secrets.IPTV_READ_SSH_KEY }}
          paused-until: ${{ vars.IPTV_PAUSED_UNTIL || '2026-11-01T00:00:00Z' }}
      - name: Update EPG
        working-directory: vendor/iptv
        env:
          EPG_RUN_BUDGET_MS: '240000'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.IPTV_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.IPTV_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.IPTV_D1_TOKEN }}
          CLOUDFLARE_EPG_BUCKET: ${{ vars.IPTV_EPG_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.IPTV_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.IPTV_R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_D1_DATABASE_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_EPG_BUCKET" && test -n "$CLOUDFLARE_R2_ACCESS_KEY_ID" && test -n "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          if node --experimental-strip-types scripts/sync-epg.ts >/dev/null 2>&1; then
            echo "IPTV EPG task completed."
          else
            echo "::error::IPTV EPG task failed. Inspect the private application's task status; raw business logs are not published here."
            exit 1
          fi
